
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Quiz Arena 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&display=swap');

:root {
    --pink: #ff4fa3;
    --purple: #9d5cff;
    --cyan: #51edff;
    --bg: #090816;
    --panel: #17142b;
    --text: #f8f5ff;
    --muted: #b2aacd;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    background:
        radial-gradient(ellipse at 15% 15%, #30134a 0%, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #19154d 0%, transparent 40%),
        var(--bg);
    font-family: 'Poppins', sans-serif;
}

button {
    font: inherit;
}

.game {
    width: 100%;
    max-width: 650px;
    position: relative;
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px var(--cyan);
}

h1 {
    margin: 15px 0 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(25px, 6vw, 42px);
    line-height: 1.3;
    color: white;
    text-shadow:
        0 0 8px var(--pink),
        0 0 25px var(--purple);
}

.header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

.panel {
    padding: clamp(18px, 5vw, 30px);
    border: 1px solid #554079;
    border-radius: 22px;
    background: rgba(23, 20, 43, 0.94);
    box-shadow:
        0 0 30px #8b35ff19,
        inset 0 0 25px #9d5cff08;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
}

.stat {
    background: #0e0c20;
    border: 1px solid #393052;
    border-radius: 12px;
    padding: 12px 5px;
    text-align: center;
}

.stat-label {
    display: block;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 1px;
}

.stat-value {
    display: block;
    margin-top: 5px;
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(15px, 4vw, 21px);
}

.progress-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--muted);
}

.progress-track {
    width: 100%;
    height: 7px;
    background: #302744;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--purple), var(--pink), var(--cyan));
    box-shadow: 0 0 12px var(--pink);
    transition: width 0.4s ease;
}

.badge {
    display: inline-block;
    color: #ffb5df;
    background: #ff4fa317;
    border: 1px solid #ff4fa34d;
    border-radius: 50px;
    padding: 6px 12px;
    font-size: 11px;
    margin-bottom: 15px;
}

#question {
    font-size: clamp(17px, 4vw, 23px);
    line-height: 1.6;
    margin: 0 0 22px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 14px;
    border: 1px solid #403655;
    border-radius: 12px;
    background: #100e21;
    color: var(--text);
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    border-color: var(--cyan);
    background: #1b1a37;
    transform: translateY(-2px);
    box-shadow: 0 0 15px #51edff15;
}

.answer:focus-visible,
button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
}

.answer:disabled {
    cursor: default;
}

.letter {
    display: grid;
    place-items: center;
    min-width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #302344;
    color: #e3c6ff;
    font-weight: 700;
}

.answer.correct {
    border-color: #4deda2;
    background: #123528;
}

.answer.correct .letter {
    background: #1a8559;
    color: white;
}

.answer.wrong {
    border-color: #ff6b91;
    background: #3a182c;
}

.answer.wrong .letter {
    background: #a52b56;
    color: white;
}

.feedback {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    line-height: 1.7;
    font-size: 13px;
    background: #0f0d20;
}

.feedback.show {
    display: block;
    animation: appear 0.3s ease;
}

.feedback.good {
    border: 1px solid #4deda2;
    color: #aaffd1;
}

.feedback.bad {
    border: 1px solid #ff6b91;
    color: #ffc0d0;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.main-btn,
.secondary-btn {
    border-radius: 10px;
    padding: 13px 17px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.2s;
}

.main-btn {
    flex: 1;
    border: none;
    color: white;
    background: linear-gradient(100deg, #873fff, #f343a0);
    box-shadow: 0 0 20px #a33bff30;
}

.main-btn:hover {
    filter: brightness(1.2);
    transform: translateY(-2px);
}

.secondary-btn {
    border: 1px solid #504065;
    background: #171329;
    color: #d8c8ef;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
}

.hidden {
    display: none !important;
}

.result {
    text-align: center;
    padding: 15px 0 5px;
    animation: appear 0.5s ease;
}

.result-icon {
    font-size: 65px;
    filter: drop-shadow(0 0 15px #ff4fa3);
}

.result h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 32px);
    color: #ff8bcb;
}

.final-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 46px;
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 25px #51edff80;
    margin: 18px 0;
}

.result p {
    color: var(--muted);
    line-height: 1.8;
}

.footer {
    text-align: center;
    color: #82779e;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 20px;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 400px) {
    .stat { padding: 10px 2px; }
    .stat-label { font-size: 9px; letter-spacing: 0; }
    .answer { padding: 11px; }
    .actions { flex-direction: column; }
}
</style>
</head>

<body>
<main class="game">

    <header class="header">
        <div class="logo">✦ MAYCHEL GAME STUDIO ✦</div>
        <h1>LOVE QUIZ ARENA 💖</h1>
        <p>Uji pengetahuanmu tentang cinta dan perhatian!</p>
    </header>

    <section class="panel" aria-label="Permainan tebak-tebakan romantis">

        <div id="gameScreen">
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">LEVEL</span>
                    <span class="stat-value" id="level">01</span>
                </div>
                <div class="stat">
                    <span class="stat-label">SKOR</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">BENAR</span>
                    <span class="stat-value" id="correctCount">0/10</span>
                </div>
            </div>

            <div class="progress-info">
                <span id="questionCount">PERTANYAAN 1 DARI 10</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="badge" id="category">💗 LOVE & CARE</div>
            <h2 id="question">Memuat pertanyaan...</h2>

            <div class="answers" id="answers"></div>

            <div class="feedback" id="feedback" aria-live="polite"></div>

            <div class="actions">
                <button class="main-btn" id="nextBtn" disabled>
                    JAWAB DULU →
                </button>
                <button class="secondary-btn" id="quitBtn">
                    Ulangi
                </button>
            </div>
        </div>

        <div id="resultScreen" class="result hidden">
            <div class="result-icon" id="resultIcon">🏆</div>
            <h2 id="resultTitle">QUIZ SELESAI!</h2>
            <p id="resultDescription"></p>

            <div class="final-score" id="finalScore">0</div>
            <p id="finalStats"></p>

            <button class="main-btn" id="playAgain" style="width:100%">
                ↻ MAIN LAGI
            </button>
        </div>

    </section>

    <footer class="footer">
        THINK SMART • PLAY FAIR • SPREAD KINDNESS
    </footer>

</main>

<script>
const questions = [
    {
        level: 1,
        category: "💗 LOVE & CARE",
        question: "Apa yang paling penting dalam sebuah hubungan yang sehat?",
        answers: [
            "Selalu harus menang debat",
            "Kepercayaan dan komunikasi",
            "Harus selalu bersama setiap saat",
            "Saling melarang berteman"
        ],
        correct: 1,
        explanation: "Kepercayaan dan komunikasi membantu kedua orang saling memahami dan menghargai."
    },
    {
        level: 1,
        category: "💌 TEBAK MAKNA",
        question: "Apa arti memberikan perhatian kepada seseorang?",
        answers: [
            "Harus membelikan hadiah mahal",
            "Harus membalas pesan dalam satu detik",
            "Peduli dan mau mendengarkan",
            "Mengatur semua kegiatannya"
        ],
        correct: 2,
        explanation: "Perhatian bisa sesederhana mendengarkan, bertanya kabar, dan menghargai perasaan."
    },
    {
        level: 1,
        category: "🌹 ROMANTIS",
        question: "Bunga apa yang sering menjadi simbol cinta?",
        answers: [
            "Mawar",
            "Kaktus",
            "Bunga bangkai",
            "Teratai"
        ],
        correct: 0,
        explanation: "Mawar, terutama mawar merah, sering menjadi simbol cinta dan kasih sayang."
    },
    {
        level: 2,
        category: "🧠 LOGIKA CINTA",
        question: "Jika seseorang sedang sedih, respons yang paling baik adalah...",
        answers: [
            "Menertawakannya",
            "Mengabaikannya",
            "Langsung menyalahkannya",
            "Mendengarkan dan bertanya apa yang dibutuhkan"
        ],
        correct: 3,
        explanation: "Mendengarkan tanpa menghakimi adalah cara yang baik untuk menunjukkan kepedulian."
    },
    {
        level: 2,
        category: "💖 TEBAK-TEBAKAN",
        question: "Apa yang semakin kuat jika dijaga dengan kejujuran?",
        answers: [
            "Rasa curiga",
            "Kepercayaan",
            "Pertengkaran",
            "Kesalahpahaman"
        ],
        correct: 1,
        explanation: "Kejujuran membantu membangun kepercayaan dari waktu ke waktu."
    },
    {
        level: 2,
        category: "💌 SITUASI",
        question: "Temanmu lupa hari pentingmu. Apa yang paling baik dilakukan?",
        answers: [
            "Langsung memutus pertemanan",
            "Membalas dengan mendiamkannya selamanya",
            "Bicarakan perasaanmu dengan tenang",
            "Menyebarkan kesalahannya"
        ],
        correct: 2,
        explanation: "Komunikasi yang tenang membantu menjelaskan perasaan tanpa memperbesar masalah."
    },
    {
        level: 3,
        category: "👑 LEVEL PRO",
        question: "Apa tanda seseorang menghargai batasan pribadimu?",
        answers: [
            "Menerima kata 'tidak' dan menghormati keputusanmu",
            "Memaksa agar selalu dituruti",
            "Memeriksa semua akunmu tanpa izin",
            "Melarangmu mempunyai teman lain"
        ],
        correct: 0,
        explanation: "Hubungan yang sehat menghormati batasan, privasi, dan keputusan setiap orang."
    },
    {
        level: 3,
        category: "💘 TEBAK MAKNA",
        question: "Mengapa meminta maaf itu penting saat melakukan kesalahan?",
        answers: [
            "Supaya selalu dianggap benar",
            "Agar orang lain tidak boleh marah",
            "Supaya kesalahan bisa diulang",
            "Untuk mengakui kesalahan dan memperbaiki keadaan"
        ],
        correct: 3,
        explanation: "Permintaan maaf yang tulus disertai usaha memperbaiki kesalahan."
    },
    {
        level: 3,
        category: "🧩 TANTANGAN",
        question: "Dua orang mempunyai pendapat berbeda. Apa pilihan terbaik?",
        answers: [
            "Memaksa satu pihak mengalah",
            "Saling mendengarkan dan mencari jalan tengah",
            "Tidak boleh berbicara lagi",
            "Menentukan siapa yang paling berkuasa"
        ],
        correct: 1,
        explanation: "Perbedaan bisa dibicarakan dengan saling menghargai dan mencari solusi bersama."
    },
    {
        level: 3,
        category: "🏆 FINAL BOSS",
        question: "Apa bentuk kasih sayang yang paling bermakna?",
        answers: [
            "Mengontrol semua keputusan",
            "Memberikan hadiah agar selalu dituruti",
            "Menghormati, peduli, dan mendukung satu sama lain",
            "Menuntut perhatian setiap waktu"
        ],
        correct: 2,
        explanation: "Kasih sayang yang sehat mengandung rasa hormat, kepedulian, dan dukungan."
    }
];

let current = 0;
let score = 0;
let correctTotal = 0;
let answered = false;
let locked = false;

const $ = id => document.getElementById(id);

function renderQuestion() {
    answered = false;

    const q = questions[current];

    $("level").textContent = String(q.level).padStart(2, "0");
    $("score").textContent = score;
    $("correctCount").textContent = correctTotal + "/" + questions.length;
    $("questionCount").textContent =
        `PERTANYAAN ${current + 1} DARI ${questions.length}`;
    $("percent").textContent =
        Math.round(current / questions.length * 100) + "%";
    $("progress").style.width =
        current / questions.length * 100 + "%";

    $("category").textContent = q.category;
    $("question").textContent = q.question;
    $("feedback").className = "feedback";
    $("feedback").textContent = "";
    $("nextBtn").disabled = true;
    $("nextBtn").textContent =
        current === questions.length - 1 ? "LIHAT HASIL 🏆" : "SOAL BERIKUTNYA →";

    const list = $("answers");
    list.replaceChildren();

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";

        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = String.fromCharCode(65 + index);

        const text = document.createElement("span");
        text.textContent = answer;

        button.append(letter, text);
        button.addEventListener("click", () => selectAnswer(index));
        list.appendChild(button);
    });
}

function selectAnswer(index) {
    if (answered || locked) return;
    answered = true;

    const q = questions[current];
    const buttons = $("answers").querySelectorAll(".answer");
    const isCorrect = index === q.correct;

    buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === q.correct) {
            button.classList.add("correct");
        } else if (i === index) {
            button.classList.add("wrong");
        }
    });

    const feedback = $("feedback");
    feedback.className = "feedback show " + (isCorrect ? "good" : "bad");

    if (isCorrect) {
        score += 100 * q.level;
        correctTotal++;
        feedback.textContent = "🎉 BENAR! +" + (100 * q.level) +
            " poin. " + q.explanation;
    } else {
        feedback.textContent = "💡 BELUM TEPAT. Jawaban yang benar: " +
            q.answers[q.correct] + ". " + q.explanation;
    }

    $("score").textContent = score;
    $("correctCount").textContent = correctTotal + "/" + questions.length;
    $("progress").style.width =
        (current + 1) / questions.length * 100 + "%";
    $("percent").textContent =
        Math.round((current + 1) / questions.length * 100) + "%";

    $("nextBtn").disabled = false;
    $("nextBtn").textContent =
        current === questions.length - 1 ? "LIHAT HASIL 🏆" : "SOAL BERIKUTNYA →";
}

function nextQuestion() {
    if (!answered || locked) return;

    if (current < questions.length - 1) {
        current++;
        renderQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    locked = true;
    $("gameScreen").classList.add("hidden");
    $("resultScreen").classList.remove("hidden");

    const percentage = Math.round(correctTotal / questions.length * 100);

    let icon = "💗";
    let title = "TERUS BERLATIH!";
    let description = "Coba lagi untuk mendapatkan skor yang lebih tinggi.";

    if (percentage === 100) {
        icon = "👑";
        title = "PERFECT LEGEND!";
        description = "Sempurna! Semua pertanyaan berhasil kamu jawab.";
    } else if (percentage >= 70) {
        icon = "🏆";
        title = "LOVE QUIZ MASTER!";
        description = "Hebat! Kamu memahami banyak hal tentang kepedulian dan hubungan sehat.";
    } else if (percentage >= 40) {
        icon = "⚡";
        title = "RISING STAR!";
        description = "Bagus! Terus asah pengetahuanmu dan coba lagi.";
    }

    $("resultIcon").textContent = icon;
    $("resultTitle").textContent = title;
    $("resultDescription").textContent = description;
    $("finalScore").textContent = score + " PTS";
    $("finalStats").textContent =
        `Jawaban benar: ${correctTotal}/${questions.length} (${percentage}%)`;
}

function restartGame() {
    current = 0;
    score = 0;
    correctTotal = 0;
    answered = false;
    locked = false;

    $("gameScreen").classList.remove("hidden");
    $("resultScreen").classList.add("hidden");
    renderQuestion();
}

$("nextBtn").addEventListener("click", nextQuestion);
$("quitBtn").addEventListener("click", restartGame);
$("playAgain").addEventListener("click", restartGame);

renderQuestion();
</script>

</body>
</html>
